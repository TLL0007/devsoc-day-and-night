<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day & Night Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button id="switch-button">Switch Mode</button>
    <div id="day-section">
        <h2>Day Mode</h2>
        <h1 id="greeting">GOOD MORNING!</h1>
        <button id="study-button">Study </button>
        <button id="todo-button">Todo List </button>
        <button id="notes-button">Quick Notes </button>
        <div id="study-view">
            <h1 id="Pomodoro">25:00</h1>
            <button id="start-button">Start </button>
            <button id="pause-button">Pause </button>
            <button id="reset-button">Reset </button>
        </div>
        <div id="todo-view">
            <input id="todo-input" placeholder="Add a new task...">
            <button id="add-todo-button">Add</button>
            <ul id="todo-list">
                
            </ul>
        </div>
        <div id="notes-view">
            <textarea id="notes" placeholder="Write your quick notes here..."></textarea>
        </div>
    </div>
    <div id="night-section">
        <h2>Night Mode</h2>
        <p id="night-quote">Time to rest and reset</p>
        <button id="lofi-sounds">Play Lofi Music</button>
        <audio id="lofi-audio" src="example.mp3" loop></audio> 
    </div>
    <script src="script.js"></script>
</body>
</html>
