<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day & Night Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="content">
        <div id="clock-container">
            <span id="clock-time"></span>
            <span id="clock-date"></span>
        </div>
        <div class="sun"></div>
        <h1 id="greeting">Lock In Time?</h1>
        <button id="switch-button" class="switch" aria-label="Toggle Night Mode">
            <span class="switch-thumb"></span>
        </button>
        <div id="day-section">
            <button id="study-button" class="button">Study (Pomodoro) </button>
            <button id="todo-button" class="button">Todo List </button>
            <button id="notes-button" class="button">Quick Notes </button>
            <div id="study-view">
                <h1 id="Pomodoro">25:00</h1>
                <button id="start-button" class="button">Start </button>
                <button id="pause-button" class="button">Pause </button>
                <button id="reset-button" class="button">Reset </button>
            </div>
            <div id="todo-view">
                <input id="todo-input" placeholder="Add a new task...">
                <button id="add-todo-button" class="button">Add</button>
                <ul id="todo-list">
                </ul>
            </div>
            <div id="notes-view">
                <textarea id="notes" placeholder="Write your quick notes here..."></textarea>
            </div>
            <button id="prank-button">
                <img src="game.png" alt="Game Icon">
            </button>
            <div id="flashbang"></div>
            <img id="job-app" src="job-app.webp" alt="Job Icon">
            <audio id="unexpected-audio" src="you'll never see it coming.mp3"></audio>
        </div>
        <div id="night-section">
            <button id="lofi-sounds" class="button">Play Lofi Music</button>
            <audio id="lofi-audio" src="lofi.mp3" loop></audio> 
            <div class="star"></div>
        </div>
        <footer>
        <p id="footer">Created by Lucas Tian</p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
